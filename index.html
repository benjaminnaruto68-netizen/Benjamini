<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WebDesk OS 12 Demo</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#6ea8ff;--accent2:#9b8cff;--bg:#07101f;--panel:rgba(18,28,47,.78);--panel2:rgba(29,42,66,.78);--text:#f5f8ff;--muted:#9ba9bd;--border:rgba(255,255,255,.12);--shadow:0 25px 80px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#050a13}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.hidden{display:none!important}
body{background:radial-gradient(circle at 50% 25%,#213c6d 0,#101d36 35%,#050a13 80%)}
#desktop{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(87,145,255,.3),transparent 24%),radial-gradient(circle at 15% 90%,rgba(142,92,255,.18),transparent 30%),linear-gradient(145deg,#07111f,#0b172b 50%,#03070e)}
#desktop:before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 210deg at 50% 50%,transparent 0 25%,rgba(90,142,255,.12),transparent 45% 100%);filter:blur(35px);animation:aurora 16s ease-in-out infinite alternate}@keyframes aurora{to{transform:rotate(14deg) scale(1.1)}}
.desktop-icons{position:absolute;top:22px;left:18px;display:grid;grid-template-columns:repeat(2,82px);gap:14px 8px;z-index:2}.desktop-icon{width:82px;padding:9px 4px;border-radius:12px;text-align:center;background:transparent}.desktop-icon:hover,.desktop-icon:focus{background:rgba(255,255,255,.1);outline:0}.icon-box{width:45px;height:45px;margin:auto;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:0 8px 20px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.13)}.desktop-icon span{display:block;font-size:11px;margin-top:7px;text-shadow:0 2px 6px #000}
.center-clock{position:absolute;top:9%;left:50%;transform:translateX(-50%);text-align:center;z-index:1;pointer-events:none}.center-clock .time{font-size:clamp(44px,7vw,88px);font-weight:600;letter-spacing:-4px}.center-clock .date{font-size:14px;color:#b9c7dc;margin-top:4px}
.taskbar{position:absolute;z-index:50;left:10px;right:10px;bottom:10px;height:64px;border:1px solid var(--border);background:rgba(9,17,31,.74);backdrop-filter:blur(28px) saturate(150%);border-radius:19px;box-shadow:var(--shadow);display:flex;align-items:center;padding:8px 10px;gap:8px}.task-center{display:flex;align-items:center;gap:5px;position:absolute;left:50%;transform:translateX(-50%)}.task-btn{height:46px;min-width:46px;padding:0 12px;border-radius:13px;background:transparent;display:grid;place-items:center;font-size:20px}.task-btn:hover{background:rgba(255,255,255,.11)}.win-logo{position:relative;width:23px;height:23px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;transform:skew(-7deg)}.win-logo i{background:#f4f8ff;display:block}.search-task{height:44px;width:min(300px,32vw);border:1px solid var(--border);background:rgba(255,255,255,.07);border-radius:13px;padding:0 15px;color:#cbd6e7;display:flex;align-items:center;gap:9px;font-size:12px}.search-task:hover{background:rgba(255,255,255,.1)}.tray{margin-left:auto;display:flex;align-items:center;gap:4px}.tray .clock{font-size:11px;text-align:right;line-height:1.35;padding:0 7px;min-width:70px}
.start-menu{position:absolute;z-index:100;left:50%;bottom:84px;transform:translateX(-50%) scale(.96);transform-origin:bottom center;width:min(700px,calc(100vw - 22px));height:min(650px,calc(100vh - 105px));padding:22px;border:1px solid var(--border);border-radius:25px;background:rgba(11,20,36,.9);backdrop-filter:blur(35px) saturate(160%);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s ease}.start-menu.open{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}.start-search{height:45px;width:100%;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.08);padding:0 16px;color:white;outline:0}.start-search:focus{border-color:var(--accent)}.start-title{font-size:13px;color:#b7c4d7;margin:23px 0 12px;font-weight:600}.app-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.start-app{padding:13px 5px;border-radius:14px;background:transparent;text-align:center;font-size:10px}.start-app:hover{background:rgba(255,255,255,.09)}.start-app .mini-icon{width:39px;height:39px;border-radius:11px;margin:auto auto 7px;display:grid;place-items:center;font-size:17px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid var(--border)}.recommended{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rec{padding:12px;border-radius:13px;background:rgba(255,255,255,.05);font-size:11px}.rec small{display:block;color:#8796ac;margin-top:4px}
.window{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-52%);width:min(1050px,calc(100vw - 34px));height:min(700px,calc(100vh - 130px));min-width:300px;min-height:230px;background:rgba(11,18,31,.88);border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:0 35px 100px rgba(0,0,0,.58);backdrop-filter:blur(25px);overflow:hidden;display:none;flex-direction:column}.window.open{display:flex}.window.active{z-index:30}.window.maximized{inset:8px;left:8px;top:8px;transform:none;width:auto;height:calc(100vh - 80px);border-radius:15px}.titlebar{height:48px;flex:0 0 48px;display:flex;align-items:center;padding:0 10px 0 15px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.035);gap:10px}.titlebar .app-title{font-size:12px;font-weight:600;flex:1}.window-controls{display:flex;gap:4px}.win-control{width:32px;height:30px;border-radius:8px;background:transparent;color:#b8c4d7}.win-control:hover{background:rgba(255,255,255,.1)}.win-control.close:hover{background:#c83c4b;color:white}.window-content{flex:1;min-height:0;overflow:hidden}

/* Advanced Multi-Engine Chrome Search Space Styles */
.browser{height:100%;display:flex;flex-direction:column;background:#f5f7fb;color:#111827}.browser-top{background:#e9edf5;border-bottom:1px solid #cdd4df;padding:7px;display:flex;gap:6px;align-items:center}.browser-nav{display:flex;gap:3px}.browser-nav button{background:transparent;color:#475569;width:32px;height:32px;border-radius:8px}.browser-nav button:hover{background:#d7dde8}.address-bar-wrapper{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #c7cfdb;border-radius:10px;padding:0 12px;gap:8px}.address-engine-icon{font-size:14px}.address{flex:1;height:34px;border:none;background:transparent;outline:0;font-size:12px;color:#172033}.browser-action{height:34px;padding:0 12px;border-radius:9px;background:#fff;border:1px solid #c7cfdb;color:#334155;font-size:11px;font-weight:500}.browser-tabs{display:flex;gap:4px;padding:5px 8px 0;background:#dfe5ee}.tab{padding:8px 12px;border-radius:9px 9px 0 0;background:#cfd7e3;color:#536174;font-size:11px;min-width:140px;display:flex;align-items:center;gap:6px}.tab.active{background:#f5f7fb;color:#1f2937;font-weight:500}.engine-select-pill{background:rgba(0,0,0,0.06);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;display:flex;gap:4px}.browser-body{position:relative;flex:1;background:white;overflow:auto}.browser-home{position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 50% 15%,#f0f4ff,#fff 55%);display:flex;flex-direction:column;align-items:center;padding:6vh 20px}.browser-logo-space{font-size:46px;font-weight:700;margin-bottom:12px;letter-spacing:-1.5px;display:flex;align-items:center;gap:10px}.browser-search-form{display:flex;width:min(640px,100%);margin-top:10px;gap:7px}.browser-search-form input{flex:1;height:46px;border:1px solid #cbd5e1;border-radius:24px;padding:0 20px;outline:0;box-shadow:0 6px 20px rgba(15,23,42,0.05);color:#1e293b;font-size:14px}.browser-search-form button{height:46px;padding:0 22px;border-radius:24px;background:#2563eb;color:white;font-weight:600;font-size:13px}.engine-toggle-row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center}.engine-radio{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;cursor:pointer;padding:6px 14px;border-radius:16px;background:rgba(0,0,0,0.04);transition:all 0.15s;}.engine-radio.active{background:#1e293b;color:#fff}

/* Live Mock Internet Search Results Interface */
.results-dashboard{padding:25px;max-width:800px;margin:0 auto;color:#1f2937;font-family:sans-ui,system-ui}.result-meta-info{font-size:12px;color:#4b5563;margin-bottom:15px}.mock-web-card{margin-bottom:24px}.mock-web-card a{font-size:18px;color:#1a0dab;text-decoration:none;font-weight:500}.mock-web-card a:hover{text-decoration:underline}.mock-web-card .site-url{font-size:12px;color:#202124;display:block;margin-top:2px}.mock-web-card p{font-size:13px;color:#4d5156;margin:4px 0 0;line-height:1.4}

/* Expanded Full Architecture YouTube Viewport */
.yt-app-container {height: 100%; background: #0f0f0f; color: #fff; display: flex; flex-direction: column;}
.yt-navbar {height: 56px; background: #212121; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);}
.yt-logo-box {display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; cursor: pointer;}
.yt-logo-box svg { fill: #ff0000; width: 28px; height: 28px; }
