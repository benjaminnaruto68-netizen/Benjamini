<script>

/* =========================
   CLOCK
========================= */

function updateClock(){

  const now = new Date();

  let hours = now.getHours();

  const minutes =
    String(now.getMinutes()).padStart(2,"0");

  const ampm =
    hours >= 12 ? "PM" : "AM";

  hours =
    hours % 12 || 12;

  const time =
    `${hours}:${minutes} ${ampm}`;

  document.getElementById("desktopTime").textContent =
    time;

  document.getElementById("trayClock").textContent =
    time;

  document.getElementById("desktopDate").textContent =
    now.toLocaleDateString(undefined,{
      weekday:"long",
      month:"long",
      day:"numeric",
      year:"numeric"
    });

}

updateClock();
setInterval(updateClock,1000);


/* =========================
   START MENU
========================= */

function toggleStart(){

  document
    .getElementById("startMenu")
    .classList.toggle("open");

}

document.addEventListener("click",function(e){

  const menu =
    document.getElementById("startMenu");

  const button =
    e.target.closest(".task-btn");

  if(
    menu.classList.contains("open") &&
    !menu.contains(e.target) &&
    !button
  ){
    menu.classList.remove("open");
  }

});


function startSearch(e){

  if(e.key !== "Enter") return;

  const value =
    e.target.value.trim();

  if(!value) return;

  openBrowser();

  setTimeout(()=>{

    document.getElementById("browserHomeSearch").value =
      value;

    homeSearch();

  },100);

}


/* =========================
   BROWSER STATE
========================= */

let browserTabs = [];

let activeBrowserTab = null;

let nextTabId = 1;


/* =========================
   OPEN BROWSER
========================= */

function openBrowser(){

  const win =
    document.getElementById("browserWindow");

  win.classList.add("open");
  win.classList.add("active");

  document.getElementById("startMenu")
    .classList.remove("open");

  if(browserTabs.length === 0){

    createBrowserTab();

  }

}


/* =========================
   CLOSE BROWSER
========================= */

function closeBrowser(){

  document
    .getElementById("browserWindow")
    .classList.remove("open");

}


/* =========================
   MINIMIZE
========================= */

function minimizeWindow(){

  document
    .getElementById("browserWindow")
    .classList.remove("open");

}


/* =========================
   MAXIMIZE
========================= */

function maximizeBrowser(){

  document
    .getElementById("browserWindow")
    .classList.toggle("maximized");

}


/* =========================
   CREATE TAB
========================= */

function createBrowserTab(){

  const tab = {

    id:nextTabId++,

    title:"New Tab",

    url:"",

    history:[],

    historyIndex:-1

  };

  browserTabs.push(tab);

  activeBrowserTab = tab.id;

  renderTabs();

  showHome();

}


/* =========================
   NEW TAB
========================= */

function newBrowserTab(){

  openBrowser();

  createBrowserTab();

}


/* =========================
   SWITCH TAB
========================= */

function switchTab(id){

  activeBrowserTab = id;

  const tab =
    browserTabs.find(t=>t.id===id);

  if(!tab) return;

  renderTabs();

  if(tab.url){

    openReal(tab.url);

  }else{

    showHome();

  }

}


/* =========================
   CLOSE TAB
========================= */

function closeTab(event,id){

  event.stopPropagation();

  if(browserTabs.length === 1){

    browserTabs[0].url = "";
    browserTabs[0].title = "New Tab";
    browserTabs[0].history = [];
    browserTabs[0].historyIndex = -1;

    activeBrowserTab =
      browserTabs[0].id;

    renderTabs();
    showHome();

    return;

  }

  const index =
    browserTabs.findIndex(t=>t.id===id);

  browserTabs =
    browserTabs.filter(t=>t.id!==id);

  if(activeBrowserTab===id){

    const newIndex =
      Math.max(0,index-1);

    activeBrowserTab =
      browserTabs[newIndex].id;

  }

  renderTabs();

  switchTab(activeBrowserTab);

}


/* =========================
   RENDER TABS
========================= */

function renderTabs(){

  const bar =
    document.getElementById("browserTabs");

  bar.innerHTML = "";

  browserTabs.forEach(tab=>{

    const el =
      document.createElement("div");

    el.className =
      "browser-tab" +
      (tab.id===activeBrowserTab
        ? " active"
        : "");

    el.onclick =
      ()=>switchTab(tab.id);

    el.innerHTML = `

      <span>🌐</span>

      <span class="browser-tab-title">
        ${escapeHTML(tab.title)}
      </span>

      <button
        class="browser-tab-close"
        onclick="closeTab(event,${tab.id})">
        ×
      </button>

    `;

    bar.appendChild(el);

  });


  const plus =
    document.createElement("button");

  plus.className = "new-tab";

  plus.textContent = "+";

  plus.onclick = newBrowserTab;

  bar.appendChild(plus);

}


/* =========================
   SEARCH URL
========================= */

function searchURL(engine,query){

  const q =
    encodeURIComponent(query);

  if(engine==="bing"){

    return "https://www.bing.com/search?q="+q;

  }

  if(engine==="duckduckgo"){

    return "https://duckduckgo.com/?q="+q;

  }

  return "https://www.google.com/search?q="+q;

}


/* =========================
   NAVIGATE
========================= */

function browserNavigate(){

  const input =
    document.getElementById("browserAddress");

  const value =
    input.value.trim();

  if(!value) return;


  let url;


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    url = value;

  }else if(
    value.includes(".") &&
    !value.includes(" ")
  ){

    url =
      "https://" + value;

  }else{

    const engine =
      document.getElementById("browserEngine").value;

    url =
      searchURL(engine,value);

  }


  navigateTo(url);

}


/* =========================
   NAVIGATE TO URL
========================= */

function navigateTo(url){

  const tab =
    browserTabs.find(t=>t.id===activeBrowserTab);

  if(!tab) return;


  tab.url = url;


  if(
    tab.history.length===0 ||
    tab.history[tab.historyIndex]!==url
  ){

    tab.history =
      tab.history.slice(
        0,
        tab.historyIndex+1
      );

    tab.history.push(url);

    tab.historyIndex =
      tab.history.length-1;

  }


  tab.title =
    getSiteName(url);


  renderTabs();


  /*
    IMPORTANT:
    Regular webpages cannot reliably be
    embedded because many websites send
    X-Frame-Options / CSP restrictions.

    Therefore we use the REAL website.
  */

  openReal(url);

}


/* =========================
   OPEN REAL WEBSITE
========================= */

function openReal(url){

  /*
    Open the actual website in a new
    browser tab.

    This bypasses iframe restrictions.
  */

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================
   SITE NAME
========================= */

function getSiteName(url){

  try{

    const host =
      new URL(url).hostname
        .replace("www.","");

    if(host.includes("youtube"))
      return "YouTube";

    if(host.includes("google"))
      return "Google";

    if(host.includes("bing"))
      return "Microsoft Bing";

    if(host.includes("duckduckgo"))
      return "DuckDuckGo";

    return host;

  }catch(e){

    return "Website";

  }

}


/* =========================
   HOME SEARCH
========================= */

function homeSearch(){

  const input =
    document.getElementById("browserHomeSearch");

  const query =
    input.value.trim();

  if(!query) return;

  const engine =
    document.getElementById("browserEngine").value;

  navigateTo(
    searchURL(engine,query)
  );

}


/* =========================
   OPEN SEARCH ENGINE
========================= */

function openSearchEngine(engine){

  document.getElementById("browserEngine").value =
    engine;

  const urls = {

    google:"https://www.google.com",

    bing:"https://www.bing.com",

    duckduckgo:"https://duckduckgo.com"

  };

  navigateTo(urls[engine]);

}


/* =========================
   BACK
========================= */

function browserBack(){

  const tab =
    browserTabs.find(t=>t.id===activeBrowserTab);

  if(!tab) return;

  if(tab.historyIndex>0){

    tab.historyIndex--;

    const url =
      tab.history[tab.historyIndex];

    tab.url = url;

    tab.title =
      getSiteName(url);

    renderTabs();

    openReal(url);

  }

}


/* =========================
   FORWARD
========================= */

function browserForward(){

  const tab =
    browserTabs.find(t=>t.id===activeBrowserTab);

  if(!tab) return;

  if(
    tab.historyIndex <
    tab.history.length-1
  ){

    tab.historyIndex++;

    const url =
      tab.history[tab.historyIndex];

    tab.url = url;

    tab.title =
      getSiteName(url);

    renderTabs();

    openReal(url);

  }

}


/* =========================
   RELOAD
========================= */

function browserReload(){

  const tab =
    browserTabs.find(t=>t.id===activeBrowserTab);

  if(tab && tab.url){

    openReal(tab.url);

  }

}


/* =========================
   HOME
========================= */

function showHome(){

  document.getElementById("browserAddress").value = "";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

createBrowserTab();

</script>
