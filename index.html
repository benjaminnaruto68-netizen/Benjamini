<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WebDesk OS 12 Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --accent: #6ea8ff;
    --accent2: #9b8cff;
    --bg: #07101f;
    --panel: rgba(18, 28, 47, 0.76);
    --panel2: rgba(29, 42, 66, 0.8);
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text: #f5f8ff;
    --muted: #9ba9bd;
    --shadow: 0 25px 80px rgba(0,0,0,0.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; overflow:hidden; font-family:Inter,system-ui,sans-serif; color:var(--text); background:#050a13}
button,input{font:inherit; border:0; color:inherit; background:transparent;}
button{cursor:pointer}
.hidden{display:none!important}

/* Premium Desktop Environment Layers */
#desktop{
    position:fixed; 
    inset:0; 
    overflow:hidden; 
    background: radial-gradient(circle at 50% 25%, #1b325c 0%, #0d172b 45%, #040810 100%);
}
#desktop:before{
    content:""; 
    position:absolute; 
    inset:-20%; 
    background: conic-gradient(from 190deg at 50% 50%, transparent 0 30%, rgba(110,168,255,0.14), transparent 50% 100%); 
    filter:blur(40px); 
    animation: aurora 18s ease-in-out infinite alternate;
}
@keyframes aurora{ to{transform:rotate(12deg) scale(1.1)} }

/* Desktop Grid Icons Navigation */
.desktop-icons{position:absolute; top:24px; left:24px; display:grid; grid-template-columns:repeat(2, 85px); gap:16px 12px; z-index:2}
.desktop-icon{width:85px; padding:10px 4px; border-radius:14px; text-align:center; transition:background 0.2s;}
.desktop-icon:hover, .desktop-icon:focus{background:rgba(255,255,255,0.08); outline:0}
.icon-box{width:46px; height:46px; margin:auto; border-radius:13px; display:grid; place-items:center; font-size:21px; background:linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.04)); box-shadow:0 8px 22px rgba(0,0,0,0.3); border:1px solid var(--glass-border)}
.desktop-icon span{display:block; font-size:11px; margin-top:8px; font-weight:500; text-shadow:0 2px 6px rgba(0,0,0,0.8)}

/* Floating Desktop Calendar Clock Widget */
.center-clock{position:absolute; top:8%; left:50%; transform:translateX(-50%); text-align:center; z-index:1; pointer-events:none}
.center-clock .time{font-size:clamp(48px,7.5vw,92px); font-weight:700; letter-spacing:-4px; text-shadow:0 4px 15px rgba(0,0,0,0.4)}
.center-clock .date{font-size:13px; color:#aabfd8; margin-top:2px; font-weight:500; text-shadow:0 2px 6px rgba(0,0,0,0.3)}

/* Window Shell Containers (With Drag & Fluid Snap Mechanics) */
.window{
    position:absolute; 
    z-index:10; 
    left:50%; top:50%; 
    transform:translate(-50%, -52%); 
    width:min(1060px, calc(100vw - 32px)); 
    height:min(710px, calc(100vh - 125px)); 
    min-width:320px; min-height:240px; 
    background: var(--panel); 
    border:1px solid var(--glass-border); 
    border-radius:18px; 
    box-shadow: var(--shadow); 
    backdrop-filter: blur(28px) saturate(140%); 
    overflow:hidden; 
    display:none; 
    flex-direction:column;
}
.window.open{display:flex}
.window.active{z-index:30}
.window.maximized{inset:10px; transform:none; width:auto; height:calc(100vh - 90px); border-radius:14px;}
.titlebar{height:50px; flex:0 0 50px; display:flex; align-items:center; padding:0 12px 0 16px; border-bottom:1px solid var(--glass-border); background:rgba(255,255,255,0.02); gap:12px}
.titlebar .app-title{font-size:12px; font-weight:600; color:#cbd9ef; flex:1}
.window-controls{display:flex; gap:6px}
.win-control{width:32px; height:32px; border-radius:8px; background:transparent; color:#a2b8dd; font-size:11px; display:grid; place-items:center}
.win-control:hover{background:rgba(255,255,255,0.08)}
.win-control.close:hover{background:#dc2626; color:white}
.window-content{flex:1; min-height:0; overflow:hidden}

/* Multi-Engine Web Browser Custom Core Interface */
.browser{height:100%; display:flex; flex-direction:column; background:rgba(10,18,32,0.5); color:#e2e8f0}
.browser-tabs{display:flex; gap:4px; padding:8px 12px 0; background:rgba(0,0,0,0.2)}
.tab{padding:8px 14px; border-radius:9px 9px 0 0; background:rgba(255,255,255,0.03); color:#94a3b8; font-size:11px; min-width:140px; display:flex; align-items:center; gap:6px; border:1px solid var(--glass-border); border-bottom:none}
.tab.active{background:var(--panel); color:#fff; font-weight:600}
.browser-top{background:rgba(0,0,0,0.15); border-bottom:1px solid var(--glass-border); padding:8px 12px; display:flex; gap:8px; align-items:center}
.browser-nav{display:flex; gap:4px}
.browser-nav button{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; background:var(--glass); border:1px solid var(--glass-border); font-size:11px}
.browser-nav button:hover{background:rgba(255,255,255,0.1)}
.address-bar-wrapper{flex:1; display:flex; align-items:center; background:rgba(0,0,0,0.2); border:1px solid var(--glass-border); border-radius:10px; padding:0 12px; gap:8px}
.address-engine-icon{font-size:14px}
.address{flex:1; height:34px; border:none; background:transparent; outline:0; font-size:12px; color:#cbd5e1}
.engine-select-pill{background:rgba(255,255,255,0.08); padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; border:1px solid var(--glass-border)}
.browser-body{position:relative; flex:1; background:transparent; overflow:auto}

/* Redesigned Minimal Welcome Search Hub View */
.browser-home{position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px;}
.browser-logo-space{font-size:48px; font-weight:800; margin-bottom:10px; letter-spacing:-1.5px; text-shadow:0 4px 12px rgba(0,0,0,0.3)}
.browser-home p{font-size:13px; color:var(--muted); max-width:460px; line-height:1.5; margin-bottom:24px; text-align:center}
.engine-toggle-row{display:flex; gap:8px; margin-bottom:24px; background:rgba(0,0,0,0.2); padding:4px; border-radius:12px; border:1px solid var(--glass-border)}
.engine-radio{padding:6px 14px; border-radius:9px; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); transition:all 0.15s}
.engine-radio.active{background:var(--glass); color:#fff; border:1px solid var(--glass-border)}
.browser-search-form{display:flex; width:min(600px,100%); gap:8px; background:rgba(0,0,0,0.15); border:1px solid var(--glass-border); padding:6px; border-radius:28px}
.browser-search-form input{flex:1; height:42px; padding:0 16px; outline:0; color:#fff; font-size:13px}
.browser-search-form button{height:42px; padding:0 22px; border-radius:20px; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:white; font-weight:700; font-size:12px; box-shadow:0 4px 12px rgba(29,78,216,0.3)}

/* Brand Shortcut Launch Pinned Grid Tiles Layout */
.quick-launch-grid{display:flex; gap:10px; justify-content:center; margin-top:28px; flex-wrap:wrap; width:100%; max-width:560px}
.quick-tile{flex:1; min-width:100px; max-width:120px; background:var(--glass); border:1px solid var(--glass-border); padding:12px; border-radius:14px; font-size:11px; font-weight:600; color:#cbd5e1; display:flex; flex-direction:column; align-items:center; gap:6px; transition:all 0.2s}
.quick-tile:hover{background:rgba(255,255,255,0.12); transform:translateY(-1px)}
.tile-icon{font-size:18px; width:34px; height:34px; border-radius:8px; display:grid; place-items:center}

/* Search Output Network Display Content Engine */
.results-dashboard{padding:24px; max-width:800px; margin:0 auto}
.result-meta-info{font-size:12px; color:var(--muted); margin-bottom:18px; padding-bottom:8px; border-bottom:1px solid var(--glass-border)}
.mock-web-card{background:rgba(0,0,0,0.12); border:1px solid var(--glass-border); padding:14px; border-radius:12px; margin-bottom:14px}
.mock-web-card .site-url{font-size:11px; color:var(--accent); display:block; margin-bottom:2px}
.mock-web-card a{font-size:17px; color:#fff; text-decoration:none; font-weight:600}
.mock-web-card a:hover{text-decoration:underline}
.mock-web-card p{font-size:13px; color:#b4c6ef; margin-top:5px; line-height:1.4}

/* Full Architecture YouTube Application Design */
.yt-app-container{height:100%; background:#0f0f14; color:#fff; display:flex; flex-direction:column}
.yt-navbar{height:56px; background:#161622; display:flex; align-items:center; padding:0 16px; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.06)}
.yt-logo-box{display:flex; align-items:center; gap:6px; font-weight:700; font-size:17px; cursor:pointer}
.yt-logo-box svg{fill:#ff0000; width:24px; height:24px}
.yt-search-box{display:flex; width:380px; background:#0c0c12; border:1px solid rgba(255,255,255,0.08); border-radius:30px; overflow:hidden}
.yt-search-box input{flex:1; background:transparent; padding:0 14px; color:white; height:32px; font-size:12px; outline:none}
.yt-search-box button{background:rgba(255,255,255,0.04); width:45px; height:32px}
.yt-nav-modes{display:flex; gap:6px}
.yt-mode-btn{padding:5px 12px; border-radius:14px; font-size:12px; font-weight:600; background:#252538}
.yt-mode-btn.active{background:#fff; color:#000}
.yt-main-layout{flex:1; display:flex; overflow:hidden}
.yt-sidebar{width:190px; background:#161622; padding:12px 8px; display:flex; flex-direction:column; gap:4px}
@media(max-width:768px){.yt-sidebar{display:none}}
.side-item{padding:8px 12px; border-radius:8px; font-size:12px; font-weight:500; display:flex; align-items:center; gap:10px; text-align:left}
.side-item:hover, .side-item.active{background:rgba(255,255,255,0.05)}
